# Minimal tmux config used only by demo.tape.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g escape-time 0
set -g default-command "env PS1='$ ' bash --norc"
# Lets Neovim detect truecolor support so the ANSI colors render.
set-environment -g COLORTERM truecolor
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 60
# Shows the prefix key while it is pressed.
set -g status-left "#{?client_prefix,#[bg=#f38ba8#,fg=#1e1e2e#,bold] Ctrl-b #[default] , tmux-review demo }"
set -g status-right "#[fg=#a6adc8]prefix + r: review this pane "
set -g window-status-format ""
set -g window-status-current-format ""
bind r display-popup -EE -w 95% -h 95% "$TMUX_REVIEW_ROOT/bin/tmux-review"
