# Minimal tmux config used only by demo.tape.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left " tmux-review demo "
set -g status-left-length 30
set -g status-right ""
set -g escape-time 0
set -g default-command "env PS1='$ ' bash --norc"
# Lets Neovim detect truecolor support so the ANSI colors render.
set-environment -g COLORTERM truecolor
bind r display-popup -EE -w 95% -h 95% "$TMUX_REVIEW_ROOT/bin/tmux-review"
